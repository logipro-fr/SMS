services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Sms\Infrastructure\Persistence\Sms\SmsRepositoryDoctrine:
    public: true

  Sms\Infrastructure\SmsProvider\Ovh\OvhSmsSender:
    public: true

  Sms\Application\Services\Sms\SendSmsService:
    arguments:
      $repository: '@Sms\Infrastructure\Persistence\Sms\SmsRepositoryDoctrine'
      $senderProvider: '@Sms\Infrastructure\SmsProvider\Ovh\OvhSmsSender'
      $smsFactory: '@Sms\Domain\Model\Sms\FactorySmsBuilder'
    public: true

  Sms\Infrastructure\Api\V1\SmsMakeController:
    arguments:
      $sendSmsService: '@Sms\Application\Services\Sms\SendSmsService'
    public: true
    tags: ['controller.service_arguments']

  Sms\Domain\Model\Sms\FactorySmsBuilder: ~
