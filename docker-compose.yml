services:
  nginx-devlocal:
    container_name: "sms-nginx"
    image: sms-nginx:latest
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    command: [nginx, '-g', 'daemon off;']
    depends_on:
      - sms-php
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - .:/var/sms
    ports:
      - "${HOST_IP}:11380:80"
    networks:
      - sms-network

  sms-php:
    container_name: "sms-php"
    image: sms-php:latest
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    user: 1000:1000
    volumes:
      - .:/var/sms
    working_dir: /var/sms
    env_file:
      - secret.env
    networks:
      - sms-network

  sms-swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: "sms-swagger-ui"
    restart: always
    environment:
      PORT_IPV6: 8080
      SUPPORTED_SUBMIT_METHODS: "['get', 'post', 'put', 'delete', 'patch']"
      SWAGGER_JSON: /v1/doc.yaml
    volumes:
      - ./docker/swagger/v1:/v1
    ports:
      - "${HOST_IP}:11302:8080"
    networks:
      - sms-network
      
  sms-mariadb:
    image: mariadb:10.11
    container_name: "sms-mariadb"
    restart: always
    volumes:
      - ${DATA_PATH}/${COMPOSE_PROJECT_NAME}/mariadb:/var/lib/mysql
      - ./mariabackup:/backup
    env_file:
      - ./docker/mariadb/db.env
    networks:
      - sms-network

  phpmyadmin:
    image: phpmyadmin
    container_name: "sms-phpmyadmin"
    restart: always
    environment:
      PMA_HOST: sms-mariadb
    depends_on:
      - sms-mariadb
    ports:
      - "${HOST_IP}:11390:80"
    networks:
      - sms-network

networks:
  sms-network:
    driver: bridge
    name: sms-network
    enable_ipv6: true
    ipam:
      config:
        - subnet: fdff:1:2c::/112
          gateway: fdff:1:2c::1

volumes:
  sms-db:
