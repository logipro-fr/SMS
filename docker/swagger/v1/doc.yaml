openapi: 3.1.0
info:
  title: Sms API
  version: 1.0.0
servers:
  - url: /api/v1
    description: API routes
  - url: http://localhost:11380/api/v1
    description: Local server
paths:
  /sms/send:
    post:
      summary: Sending an SMS
      operationId: sendSms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - messageText
                - phoneNumber
              properties:
                messageText:
                  type: string
                  description: The text of the sent SMS
                  example: Hello, this is a test message.
                phoneNumber:
                  type: string
                  description: The phone number to which the SMS was sent
                  example: "+33601020304"
      responses:
        '200':
          description: SMS successfully sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: SMS sent successfully
                    example: true
                  data:
                    type: object
                    properties:
                      statusMessage:
                        type: string
                        description: A status message
                        example: Message sent successfully
                      smsId:
                        type: string
                        description: SMS identity
                        example: sms_123456780
        '400':
          description: Invalid phone number or bad receivers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    type: object
                    example: {}
                  error:
                    type: string
                    description: Exception class names such as InvalidPhoneNumberException or SmsApiBadReceiverException
                    example: InvalidPhoneNumberException
                  error-message:
                    type: string
                    example: Invalid phone number or bad receivers
        '402':
          description: Insufficient credit
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    type: object
                    example: {}
                  error:
                    type: string
                    enum:
                      - SmsApiNoCreditException
                    example: SmsApiNoCreditException
                  error-message:
                    type: string
                    example: Insufficient credit to send SMS
        '403':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  data:
                    type: object
                    example: {}
                  error:
                    type: string
                    enum:
                      - InvalidApiKeyException
                    example: InvalidApiKeyException
                  error-message:
                    type: string
                    example: Invalid OVH API key
